<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CORBIQ |Company Settings</title>

    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />

    <style>
        /* Material Design 3 & Premium Theme Variables */
        :root {
            --md-sys-color-primary: #6750A4;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #EADDFF;
            --md-sys-color-on-primary-container: #21005D;
            --md-sys-color-surface: #FDFBFF;
            --md-sys-color-surface-container: #F3EDF7;
            --md-sys-color-surface-container-high: #ECE6F0;
            --md-sys-color-on-surface: #1C1B1F;
            --md-sys-color-on-surface-variant: #49454F;
            --md-sys-color-outline: #79747E;
            --md-sys-color-outline-variant: #CAC4D0;
            --md-sys-color-error: #B3261E;
            
            /* Premium Gradients */
            --gemini-gradient: linear-gradient(90deg, #4285F4, #9b72cb, #d96570);
            --btn-gradient: linear-gradient(135deg, #6750A4, #9b72cb);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--md-sys-color-surface-container);
            color: var(--md-sys-color-on-surface);
            -webkit-tap-highlight-color: transparent;
            line-height: 1.5;
            padding-bottom: 32px; /* Adjusted padding since sticky bar is removed */
        }

        /* --- Layout & Container --- */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .page-header {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: var(--gemini-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-header .icon {
            font-size: 32px;
            color: var(--md-sys-color-primary);
        }

        /* --- M3 Elevated Cards --- */
        .card {
            background-color: var(--md-sys-color-surface);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .card:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--md-sys-color-surface-container);
            padding-bottom: 12px;
        }

        .card-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--md-sys-color-on-surface);
        }

        .card-header .material-symbols-rounded {
            color: var(--md-sys-color-primary);
            background-color: var(--md-sys-color-primary-container);
            padding: 6px;
            border-radius: 12px;
            font-size: 20px;
        }

        /* --- Grid Layout for Forms --- */
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        /* --- Form Inputs (M3 Style) --- */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 500;
            color: var(--md-sys-color-on-surface-variant);
            margin-left: 4px;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            color: var(--md-sys-color-on-surface);
            background-color: var(--md-sys-color-surface);
            transition: all 0.2s ease;
            appearance: none; /* For selects */
        }

        /* Custom Dropdown Arrow */
        select.input-field {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2349454F' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 40px;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--md-sys-color-primary);
            box-shadow: 0 0 0 1px var(--md-sys-color-primary);
            background-color: var(--md-sys-color-surface);
        }

        .input-field::placeholder {
            color: var(--md-sys-color-outline);
            opacity: 0.8;
        }

        .input-field:invalid:focus {
            border-color: var(--md-sys-color-error);
            box-shadow: 0 0 0 1px var(--md-sys-color-error);
        }

        /* Readonly Input Styling */
        input[readonly].input-field {
            background-color: var(--md-sys-color-surface-container-high);
            color: var(--md-sys-color-on-surface-variant);
            border-color: transparent;
            cursor: not-allowed;
        }

        input[readonly].input-field:focus {
            box-shadow: none;
            border-color: transparent;
        }

        /* --- Form Actions --- */
        .form-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 8px;
            padding-bottom: 24px;
            gap: 16px; /* Added gap between buttons */
        }

        .btn-clear {
            background: transparent;
            color: var(--md-sys-color-primary);
            border: 1px solid var(--md-sys-color-outline);
            padding: 13px 24px; /* 1px less padding to account for border */
            border-radius: 9999px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-clear:hover {
            background-color: var(--md-sys-color-surface-container-high);
            border-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-primary);
        }

        .btn-clear:active {
            background-color: var(--md-sys-color-primary-container);
        }

        .btn-save {
            background: var(--btn-gradient);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 9999px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(103, 80, 164, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(103, 80, 164, 0.4);
        }

        .btn-save:active {
            transform: translateY(0);
        }

        /* --- Toast Notification --- */
        .toast {
            position: fixed;
            bottom: 40px; /* Adjusted since sticky bar is removed */
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--md-sys-color-on-surface);
            color: var(--md-sys-color-surface);
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            visibility: visible;
        }

        .toast .material-symbols-rounded {
            color: #A8E6CF; /* Soft green success */
        }

        /* --- Desktop Responsive Adjustments --- */
        @media (min-width: 768px) {
            .grid-layout {
                grid-template-columns: 1fr 1fr;
            }
            .card {
                padding: 32px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="page-header">
            <span class="material-symbols-rounded icon">domain</span>
            <h1>Company Settings</h1>
        </div>

        <form id="company-form">
            <!-- 1. Basic Info Card -->
            <section class="card">
                <div class="card-header">
                    <span class="material-symbols-rounded">info</span>
                    <h2>Basic Information</h2>
                </div>
                <div class="grid-layout">
                    <div class="input-group full-width">
                        <label for="companyId">Company ID (Auto-generated)</label>
                        <input type="text" id="companyId" class="input-field" value="COM-00001" readonly>
                    </div>
                    <div class="input-group full-width">
                        <label for="companyName">Company Name *</label>
                        <input type="text" id="companyName" class="input-field" placeholder="e.g. COREBIQ Global Inc." required>
                    </div>
                    <div class="input-group full-width">
                        <label for="tagline">Tagline</label>
                        <input type="text" id="tagline" class="input-field" placeholder="Empowering enterprise solutions">
                    </div>
                </div>
            </section>

            <!-- 2. Address Details Card -->
            <section class="card">
                <div class="card-header">
                    <span class="material-symbols-rounded">location_on</span>
                    <h2>Address Details</h2>
                </div>
                <div class="grid-layout">
                    <div class="input-group full-width">
                        <label for="address1">Address Line 1 *</label>
                        <input type="text" id="address1" class="input-field" placeholder="Street address, P.O. box, company name, c/o" required>
                    </div>
                    <div class="input-group full-width">
                        <label for="address2">Address Line 2</label>
                        <input type="text" id="address2" class="input-field" placeholder="Apartment, suite, unit, building, floor, etc.">
                    </div>
                    
                    <div class="input-group">
                        <label for="district">District / City *</label>
                        <input type="text" id="district" class="input-field" placeholder="e.g. Kozhikode" required>
                    </div>
                    <div class="input-group">
                        <label for="state">State / Province *</label>
                        <select id="state" class="input-field" required>
                            <option value="" disabled selected>Select State</option>
                            <option value="kerala">Kerala</option>
                            <option value="karnataka">Karnataka</option>
                            <option value="tamil_nadu">Tamil Nadu</option>
                            <option value="maharashtra">Maharashtra</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="pincode">Pincode / ZIP *</label>
                        <input type="text" id="pincode" class="input-field" placeholder="e.g. 673305" required>
                    </div>
                    <div class="input-group">
                        <label for="country">Country *</label>
                        <select id="country" class="input-field" required>
                            <option value="" disabled selected>Select Country</option>
                            <option value="IN">India</option>
                            <option value="AE">United Arab Emirates</option>
                            <option value="US">United States</option>
                            <option value="UK">United Kingdom</option>
                            <option value="FR">France</option>
                        </select>
                    </div>
                </div>
            </section>

            <!-- 3. Localization Card -->
            <section class="card">
                <div class="card-header">
                    <span class="material-symbols-rounded">language</span>
                    <h2>Localization</h2>
                </div>
                <div class="grid-layout">
                    <div class="input-group">
                        <label for="currency">Base Currency *</label>
                        <select id="currency" class="input-field" required>
                            <option value="" disabled selected>Select Currency</option>
                            <option value="INR">INR (₹) - Indian Rupee</option>
                            <option value="USD">USD ($) - US Dollar</option>
                            <option value="AED">AED (د.إ) - UAE Dirham</option>
                            <option value="EUR">EUR (€) - Euro</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="language">Primary Language *</label>
                        <select id="language" class="input-field" required>
                            <option value="en" selected>English</option>
                            <option value="ar">Arabic (العربية)</option>
                            <option value="fr">French (Français)</option>
                        </select>
                    </div>
                </div>
            </section>

            <!-- 4. Contact Info Card -->
            <section class="card">
                <div class="card-header">
                    <span class="material-symbols-rounded">contact_support</span>
                    <h2>Contact Information</h2>
                </div>
                <div class="grid-layout">
                    <div class="input-group full-width">
                        <label for="email">Company Email *</label>
                        <input type="email" id="email" class="input-field" placeholder="contact@company.com" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="mobile">Mobile Number *</label>
                        <input type="tel" id="mobile" class="input-field" placeholder="+91 9876543210" pattern="[\+0-9\s\-]{10,15}" required title="Please enter a valid phone number (10-15 digits).">
                    </div>
                    
                    <div class="input-group">
                        <label for="whatsapp">WhatsApp Number</label>
                        <input type="tel" id="whatsapp" class="input-field" placeholder="+91 9876543210" pattern="[\+0-9\s\-]{10,15}" title="Please enter a valid phone number (10-15 digits).">
                    </div>
                </div>
            </section>

            <!-- Form Action Button (Flows with content) -->
            <div class="form-actions">
                <button type="button" class="btn-clear" id="btn-clear">
                    <span class="material-symbols-rounded">clear_all</span>
                    Clear
                </button>
                <button type="submit" class="btn-save">
                    <span class="material-symbols-rounded">save</span>
                    Save Changes
                </button>
            </div>
        </form>
    </div>

    <!-- Success Toast -->
    <div id="toast" class="toast">
        <span class="material-symbols-rounded">check_circle</span>
        <span>Settings Saved Successfully!</span>
    </div>

    <!-- JavaScript for Form Submission & Toast -->
    <script>
        const form = document.getElementById('company-form');
        const toast = document.getElementById('toast');
        const btnClear = document.getElementById('btn-clear');
        let toastTimeout;

        // Clear form logic (automatically preserves the readonly default value)
        btnClear.addEventListener('click', function() {
            form.reset();
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Prevent actual page reload

            // Ideally here you would gather form data: const formData = new FormData(form);
            // And send via fetch/axios to your backend.

            // Show Toast Notification
            showToast();
        });

        function showToast() {
            // Clear existing timeout if multiple clicks happen
            if(toastTimeout) clearTimeout(toastTimeout);
            
            toast.classList.add('show');
            
            // Hide after 3 seconds
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
